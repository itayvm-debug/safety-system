/* ── Story flow bar ── */
const sfEl=document.getElementById('story-flow');
const lgEl=document.getElementById('legend');
ACTS.forEach((act,i)=>{
  const pill=document.createElement('div');pill.className='sf-act';
  pill.innerHTML=`<span class="sf-pill" style="background:${act.bg};color:${act.color};border:1px solid ${act.color}33;">${act.label}</span>`;
  sfEl.appendChild(pill);
  if(i<ACTS.length-1){const arr=document.createElement('span');arr.className='sf-arrow';arr.textContent='→';sfEl.appendChild(arr);}
  const lg=document.createElement('div');lg.className='lg-item';
  lg.innerHTML=`<div class="lg-dot" style="background:${act.color};"></div>${act.id}`;lgEl.appendChild(lg);
});

/* ── Build act sections ── */
const actsEl=document.getElementById('acts');
let gBeat=0;
ACTS.forEach((act,ai)=>{
  const section=document.createElement('div');section.className='act-section';
  const header=document.createElement('div');header.className='act-header';
  header.style.cssText=`background:${act.bg};border-left-color:${act.color};`;
  header.innerHTML=`<div style="width:24px;height:24px;border-radius:6px;background:${act.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;flex-shrink:0;">${act.id}</div>
    <div class="act-title" style="color:${act.color};">${act.label}</div>
    <div class="act-beats">B${String(gBeat+1).padStart(2,'0')}–B${String(gBeat+4).padStart(2,'0')} · ${(gBeat*0.5).toFixed(1)}s–${((gBeat+4)*0.5).toFixed(1)}s</div>`;
  section.appendChild(header);
  const row=document.createElement('div');row.className='frames-row';

  act.beats.forEach((beat,bi)=>{
    const beatIdx=gBeat+bi;
    const beatNum=String(beatIdx+1).padStart(2,'0');
    const t=(beatIdx*0.5).toFixed(1);
    const cell=document.createElement('div');cell.className='frame-cell';
    const label=document.createElement('div');label.className='frame-label';
    label.innerHTML=`<span class="fn" style="color:${act.color};">B${beatNum}</span><span class="ft">${t}s</span>`;
    const wrap=document.createElement('div');wrap.className='mini-wrap';
    wrap.style.borderColor=act.color+'55';
    wrap.title=`B${beatNum}: ${beat.desc}`;
    const mini=document.createElement('div');mini.className='mini-stage';
    wrap.appendChild(mini);
    const desc=document.createElement('div');desc.className='beat-desc';desc.textContent=beat.desc;
    cell.appendChild(label);cell.appendChild(wrap);cell.appendChild(desc);row.appendChild(cell);

    const _ai=ai,_bi=bi;
    setTimeout(()=>{
      const [cx,cy,cw,ch,cr]=beat.c;
      const card=document.createElement('div');
      if(beat.fullBleed){
        card.style.cssText=`position:absolute;left:0;top:0;width:1440px;height:1440px;border-radius:0;overflow:hidden;z-index:20;`;
      } else {
        card.style.cssText=`position:absolute;left:${cx-cw/2}px;top:${cy-ch/2}px;width:${cw}px;height:${ch}px;border-radius:${cr||16}px;background:white;border:1.5px solid #E5E7EB;box-shadow:0 12px 44px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);overflow:hidden;z-index:20;`;
      }
      card.innerHTML=beat.fn();
      mini.appendChild(card);
      if(beat.cur){
        const cur=document.createElement('div');
        cur.style.cssText=`position:absolute;left:${beat.cur.x-18}px;top:${beat.cur.y-18}px;width:36px;height:36px;z-index:100;`;
        cur.innerHTML=CUR;mini.appendChild(cur);
      }
      mini.style.transform=`scale(${wrap.offsetWidth/1440})`;
      const _wrap=wrap;
      wrap.addEventListener('click',()=>openModal(_ai,_bi));
    },beatIdx*14);
  });
  section.appendChild(row);actsEl.appendChild(section);
  gBeat+=4;
});

/* ── Rescale ── */
function rescaleAll(){
  document.querySelectorAll('.mini-wrap').forEach(w=>{
    const s=w.querySelector('.mini-stage');if(s)s.style.transform=`scale(${w.offsetWidth/1440})`;
  });
  document.getElementById('modal-stage').style.transform='scale(0.569)';
}
window.addEventListener('resize',rescaleAll);

/* ── Modal ── */
function openModal(ai,bi){
  const act=ACTS[ai],beat=act.beats[bi];
  const ms=document.getElementById('modal-stage');ms.innerHTML='';
  const [cx,cy,cw,ch,cr]=beat.c;
  const card=document.createElement('div');
  if(beat.fullBleed){
    card.style.cssText=`position:absolute;left:0;top:0;width:1440px;height:1440px;border-radius:0;overflow:hidden;z-index:20;`;
  } else {
    card.style.cssText=`position:absolute;left:${cx-cw/2}px;top:${cy-ch/2}px;width:${cw}px;height:${ch}px;border-radius:${cr||16}px;background:white;border:1.5px solid #E5E7EB;box-shadow:0 12px 44px rgba(0,0,0,.1);overflow:hidden;z-index:20;`;
  }
  card.innerHTML=beat.fn();ms.appendChild(card);
  if(beat.cur){
    const cur=document.createElement('div');
    cur.style.cssText=`position:absolute;left:${beat.cur.x-18}px;top:${beat.cur.y-18}px;width:36px;height:36px;z-index:100;`;
    cur.innerHTML=CUR;ms.appendChild(cur);
  }
  ms.style.transform='scale(0.569)';
  const gb=ACTS.slice(0,ai).reduce((a,b)=>a+b.beats.length,0)+bi;
  document.getElementById('modal-label').textContent=`B${String(gb+1).padStart(2,'0')} · ${(gb*0.5).toFixed(1)}s — ${beat.desc}`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

  {id:'still-lifting', fn:()=>equipHero('lifting'), c:[720,760,1000,860,20], cur:{x:900,y:840}, ai:3, bi:2},

  {id:'still-loop', fn:()=>icon(), c:[720,720,280,280,28], cur:{x:1100,y:480}, ai:7, bi:3},
];
STILLS.forEach(s=>{
  const wrap=document.getElementById(s.id);if(!wrap)return;
  const mini=document.createElement('div');mini.className='mini-stage';wrap.appendChild(mini);
  const [cx,cy,cw,ch,cr]=s.c;
  const card=document.createElement('div');
  card.style.cssText=`position:absolute;left:${cx-cw/2}px;top:${cy-ch/2}px;width:${cw}px;height:${ch}px;border-radius:${cr}px;background:white;border:1.5px solid #E5E7EB;box-shadow:0 12px 44px rgba(0,0,0,.1);overflow:hidden;z-index:20;`;
  card.innerHTML=s.fn();mini.appendChild(card);
  const cur=document.createElement('div');
  cur.style.cssText=`position:absolute;left:${s.cur.x-18}px;top:${s.cur.y-18}px;width:36px;height:36px;z-index:100;`;
  cur.innerHTML=CUR;mini.appendChild(cur);
  mini.style.transform=`scale(${wrap.offsetWidth/1440})`;
  const _s=s;
  wrap.addEventListener('click',()=>openModal(_s.ai,_s.bi));
});
setTimeout(rescaleAll,800);
</script>
