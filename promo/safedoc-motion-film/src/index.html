<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>SafeDoc Motion Film — 9:16 Portrait</title>
<meta name="viewport" content="width=1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;}
body{font-family:'Heebo','Segoe UI',Arial,sans-serif;}
#stage-wrap{position:relative;transform-origin:center center;}
#stage{width:1440px;height:2560px;background:#F9FAFB;position:relative;overflow:hidden;user-select:none;}
#card{position:absolute;overflow:hidden;z-index:20;}
#cursor{position:absolute;z-index:100;pointer-events:none;width:44px;height:44px;}
#cursor svg{width:44px;height:44px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.28));}
#controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(12,12,12,.9);color:white;backdrop-filter:blur(8px);border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:14px;z-index:1000;font-family:'IBM Plex Mono','Heebo',monospace;font-size:12px;}
#scrubber{width:360px;accent-color:#f97316;cursor:pointer;}
#play-btn{background:#f97316;border:none;color:white;border-radius:8px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:700;}
#beat-info{color:#9ca3af;min-width:100px;}
</style>
</head>
<body>
<div id="stage-wrap">
<div id="stage">
  <div id="card"></div>
  <div id="cursor">
    <svg viewBox="0 0 20 20" fill="none"><path d="M3 2l5.5 15 2.5-5.5 5.5-2.5z" fill="#1c2b3a" stroke="white" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
</div>
<div id="controls">
  <button id="play-btn" onclick="togglePlay()">▶</button>
  <input type="range" id="scrubber" min="0" max="15.983" step="0.016667" value="0" oninput="seek(+this.value)">
  <span id="beat-info">B01 · 0.00s</span>
  <span style="color:#555;font-size:10px;">← → ±beat · Space play</span>
</div>
<script>
// ════════════════════════════════════════════════════════════════
// SAFEDOC MOTION FILM — Vertical Morph Preview · 1440×2560 · 9:16
// 120 BPM · 32 beats · 0.5s/beat · 16s
// One-object morph: container interpolates continuously,
// content cross-fades with blur at every beat boundary.
// ════════════════════════════════════════════════════════════════

const A = '../assets/';
const SW = 1440, SH = 2560;
const DURATION = 16, BD = 0.5, NB = 32;
const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const eio   = t => t<.5 ? 4*t**3 : 1-(-2*t+2)**3/2;

// ── Render functions ──────────────────────────────────────────────

      <img src="${A}safedoc-app-icon.png" style="width:100%;height:100%;object-fit:cover;">
    </div>
  </div>`;
}

      <div style="border:2.5px solid #D1D5DB;border-radius:20px;padding:26px 32px;font-size:30px;color:#9CA3AF;background:#F9FAFB;">natan@valdman.co.il</div>
      <div style="border:2.5px solid #D1D5DB;border-radius:20px;padding:26px 32px;font-size:30px;color:#111827;background:#F9FAFB;">••••••••••</div>

  </div>`;
}

    <div style="flex:1;padding:72px 80px;display:flex;flex-direction:column;gap:48px;overflow:hidden;">
      <div style="font-size:44px;font-weight:700;color:#374151;">ספטמבר 2026 — סקירה כללית</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;">
        <div style="background:white;border-radius:28px;padding:56px 44px;box-shadow:0 4px 16px rgba(0,0,0,.06);">

          <div style="font-size:128px;font-weight:900;color:#111827;line-height:1;">42</div>
        </div>
        <div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:28px;padding:56px 44px;">
          <div style="font-size:28px;color:#15803d;margin-bottom:14px;">בתוקף</div>
          <div style="font-size:128px;font-weight:900;color:#15803d;line-height:1;">96%</div>
        </div>
        <div style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border-radius:28px;padding:56px 44px;">

          <span style="font-size:30px;font-weight:700;color:${c};">${l}</span>

    </div>
  </div>`;
}

function workerHero(expiring){
  const docs=[
    {l:'תדריך בטיחות',s:'valid',lb:'תקין',i:'✓'},

  ];
  const cs={valid:{bg:'#f0fdf4',br:'#bbf7d0',c:'#16a34a',tc:'#15803d'},exp:{bg:'#fefce8',br:'#fef08a',c:'#ca8a04',tc:'#854d0e'}};
  return`<div dir="rtl" style="width:100%;height:100%;background:white;padding:72px 68px;display:flex;flex-direction:column;gap:36px;">

}

    <div style="padding:44px 52px;background:#F9FAFB;border-bottom:2px solid #E5E7EB;display:flex;align-items:center;gap:22px;flex-shrink:0;">

  const items=[

// ── HTML cache — each fn() is pure; render once per session ──────────────
const CACHE = {};
function html(bi) {
  if (!(bi in CACHE)) CACHE[bi] = BEATS[bi].fn();
  return CACHE[bi];
}

// ── Stage refs ────────────────────────────────────────────────────────────
const card   = document.getElementById('card');
const cursor = document.getElementById('cursor');

// ── seek(t) — one-object morph engine ────────────────────────────────────
// Container geometry: continuously interpolated via eased p (eio).
// Content: two-layer blur cross-fade over raw [0.3 → 0.7] of each beat.
window.seek = function(t) {
  t = clamp(t, 0, DURATION - 0.001);
  const bi  = Math.min(NB - 1, Math.floor(t / BD));
  const raw = (t - bi * BD) / BD;
  const p   = eio(raw);
  const ni  = (bi + 1) % NB;

  // Container morph
  const [x0,y0,w0,h0,r0] = BEATS[bi].c;
  const [x1,y1,w1,h1,r1] = BEATS[ni].c;
  const cx = lerp(x0,x1,p), cy = lerp(y0,y1,p);
  const cw = lerp(w0,w1,p), ch = lerp(h0,h1,p);
  const cr = lerp(r0,r1,p);

  const isFB = cw >= 1430 && ch >= 2550;
  if (isFB) {
    card.style.cssText = `position:absolute;left:0;top:0;width:${SW}px;height:${SH}px;border-radius:0;border:none;box-shadow:none;overflow:hidden;z-index:20;background:white;`;
  } else {
    const l = (cx-cw/2).toFixed(1), tp = (cy-ch/2).toFixed(1);
    card.style.cssText = `position:absolute;left:${l}px;top:${tp}px;width:${cw.toFixed(1)}px;height:${ch.toFixed(1)}px;border-radius:${cr.toFixed(1)}px;background:white;border:1.5px solid #E5E7EB;box-shadow:0 20px 64px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.06);overflow:hidden;z-index:20;`;
  }

  // ── Content crossfade — complementary opacity guarantee ──────────────────
  // oA + oB ≡ 1.0 throughout: card background never exposed → no white flash.
  // Eio easing on a 150ms symmetric window: brief mix (~5 frames at peak),
  // then snaps cleanly to new. Container morph continues uninterrupted.
  const TS = 0.35, TE = 0.65;
  const xf  = raw < TS ? 0 : raw > TE ? 1 : (raw - TS) / (TE - TS);
  const exf = eio(xf);   // eased; oA = 1-exf, oB = exf → sum always 1

  if (exf <= 0) {
    card.innerHTML = `<div style="position:absolute;inset:0;overflow:hidden;">${html(bi)}</div>`;
  } else if (exf >= 1) {
    card.innerHTML = `<div style="position:absolute;inset:0;overflow:hidden;">${html(ni)}</div>`;
  } else {
    const oA = (1 - exf).toFixed(3), oB = exf.toFixed(3);
    const bA = (exf * 6).toFixed(1),  bB = ((1 - exf) * 6).toFixed(1);
    card.innerHTML =
      `<div style="position:absolute;inset:0;overflow:hidden;opacity:${oA};filter:blur(${bA}px);">${html(bi)}</div>` +
      `<div style="position:absolute;inset:0;overflow:hidden;opacity:${oB};filter:blur(${bB}px);">${html(ni)}</div>`;
  }

  // Cursor
  const csx = lerp(BEATS[bi].cur.x, BEATS[ni].cur.x, p);
  const csy = lerp(BEATS[bi].cur.y, BEATS[ni].cur.y, p);
  cursor.style.left = (csx-22)+'px';
  cursor.style.top  = (csy-22)+'px';

  document.getElementById('beat-info').textContent = `B${String(bi+1).padStart(2,'0')} · ${t.toFixed(2)}s`;
  document.getElementById('scrubber').value = t;
};

let raf=null, startTime=null, tCurr=0, playing=false;
function togglePlay(){
  if(playing){cancelAnimationFrame(raf);playing=false;document.getElementById('play-btn').textContent='▶';}
  else{
    if(tCurr>=DURATION-0.02)tCurr=0;
    playing=true;startTime=null;document.getElementById('play-btn').textContent='⏸';
    function frame(ts){
      if(!startTime)startTime=ts-tCurr*1000;
      tCurr=(ts-startTime)/1000;
      if(tCurr>=DURATION){tCurr=0;startTime=ts;}
      seek(tCurr);raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }
}
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight')seek(clamp(tCurr+BD,0,DURATION-0.001));
  else if(e.key==='ArrowLeft') seek(clamp(tCurr-BD,0,0));
  tCurr=+document.getElementById('scrubber').value;
});

// Scale to viewport
function scaleStage(){const s=Math.min(window.innerWidth/SW,window.innerHeight/SH);document.getElementById('stage-wrap').style.transform=`scale(${s})`;}
window.addEventListener('resize',scaleStage);
scaleStage();
seek(0);
</script>
</body>
</html>
